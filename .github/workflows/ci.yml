name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  commit-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2
        with:
          message: true
          branch: false

  test:
    # A rule is shell, and it runs on whatever machine a consumer commits from.
    # The interesting difference between those machines is the shell: Windows
    # puts Git Bash and lefthook's Windows executor between the rule file and the
    # person committing, and a quoting or line-ending mistake surfaces there and
    # nowhere else. That is the failure this matrix exists to catch, so the two
    # legs run independently — a Windows-only break should still report as one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The npm package fetches the platform binary in its postinstall step.
      - run: npm install --global lefthook@2

      - run: lefthook version

      # Every rule's YAML has to parse before the runner can read a command out
      # of it, so this is a strict subset of what test/run.sh covers. It is here
      # for the clearer failure message on a malformed rule.
      - run: lefthook validate

      # `bash …` rather than `./…`: a Windows checkout does not reliably carry
      # the executable bit.
      - run: bash test/run.sh

      - run: bash test/smoke.sh
